[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
via_ir = true
optimizer = true
optimizer_runs = 200
# forge-std v1.16.2 is a git submodule at lib/forge-std (see .gitmodules)
remappings = ["forge-std/=lib/forge-std/src/"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "thousands"
ignore = ["lib/**"]
